name: Deploy Cloudflare Worker

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-production
  cancel-in-progress: false

jobs:
  deploy-worker:
    name: Apply D1 migration and deploy Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 d1 migrations apply as-care-auth --remote
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
      - name: Verify deployed Worker and D1 auth schema
        run: |
          response="$(curl --fail --silent --show-error -H "Origin: https://shahariarshanto.github.io" https://fitnesstracker.sshahariar062.workers.dev/api/auth/health)"
          echo "$response"
          echo "$response" | grep -q '"ok":true'
      - name: Test live Sign Up, Login, session and Logout (opt-in; creates retained test accounts)
        if: ${{ vars.RUN_PRODUCTION_SMOKE_TESTS == 'true' }}
        run: node scripts/test-live-auth.mjs

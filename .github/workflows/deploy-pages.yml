name: Deploy GitHub Pages

on:
  workflow_run:
    workflows: ["Deploy Cloudflare Worker"]
    types: [completed]
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout successfully deployed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Install Playwright and Chromium for live feature tests
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Test live app features using isolated dummy account and data
        env:
          APP_URL: https://shahariarshanto.github.io/Fitness-tracker/
        run: node scripts/test-ui-features.mjs

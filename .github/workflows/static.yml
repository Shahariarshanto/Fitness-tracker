# Validate the app on every push and pull request. Production deployment is gated
# behind a successful Cloudflare D1 migration and Worker deployment.
name: Validate AS Care

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validate:
    name: Static project validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate project structure and runtime dependencies
        run: node scripts/validate-project.mjs
      - name: Test Worker authentication, user isolation and sync
        run: node scripts/test-worker-sync.mjs

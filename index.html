<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f6f3">
  <meta name="description" content="AS Care — personal mobility and health tracking">
  <title>AS Care</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./assets/css/tokens.css">
  <link rel="stylesheet" href="./assets/css/base.css">
  <link rel="stylesheet" href="./assets/css/components.css">
  <link rel="stylesheet" href="./assets/css/pages.css">
  <link rel="stylesheet" href="./assets/css/movement.css">
  <link rel="stylesheet" href="./assets/css/overview.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="AS Care home"><span class="brand-mark" aria-hidden="true">a</span><span>AS <strong>Care</strong></span></a>
      <div class="topbar-meta"><time id="today-label"></time><span class="status-dot" aria-hidden="true"></span></div>
    </header>
    <main id="app-main">
      <section class="welcome">
        <p class="eyebrow">YOUR PERSONAL AXSpA COMPANION</p>
        <h1>প্রতিদিনের যত্ন, নিজের গতিতে</h1>
        <p class="welcome-copy">নড়াচড়া, উপসর্গ ও সুস্থতার অগ্রগতি এক জায়গায় রাখুন।</p>
      </section>
      <section class="page-panel" data-page-panel="overview" role="tabpanel">
        <div class="panel-heading"><div><p class="eyebrow">OVERVIEW</p><h2>আজকের সারসংক্ষেপ</h2></div><span class="panel-index">01</span></div>
        <div data-overview-content></div>
        <div data-medication-content></div>
      </section>
      <section class="page-panel" data-page-panel="movement" role="tabpanel" hidden><div class="panel-heading"><div><p class="eyebrow">DAILY MOVEMENT</p><h2>Movement</h2></div><span class="panel-index">02</span></div><div data-movement-content></div></section>
      <section class="page-panel" data-page-panel="insights" role="tabpanel" hidden><div class="panel-heading"><div><p class="eyebrow">YOUR PROGRESS</p><h2>Insights</h2></div><span class="panel-index">03</span></div><div data-insights-content></div></section>
      <section class="page-panel" data-page-panel="health" role="tabpanel" hidden>
        <div class="panel-heading"><div><p class="eyebrow">HEALTH JOURNAL</p><h2>Health</h2></div><span class="panel-index">04</span></div>
        <div class="health-content" data-health-content></div>
      </section>
      <section class="page-panel" data-page-panel="settings" role="tabpanel" hidden><div class="panel-heading"><div><p class="eyebrow">PREFERENCES</p><h2>Settings</h2></div><span class="panel-index">05</span></div><div class="settings-content" data-settings-content></div></section>
    </main>
    <nav class="primary-nav" aria-label="প্রধান নেভিগেশন" role="tablist">
      <button class="nav-item" type="button" role="tab" data-page="overview" aria-selected="true"><span aria-hidden="true">⌂</span><span>Overview</span></button>
      <button class="nav-item" type="button" role="tab" data-page="movement" aria-selected="false"><span aria-hidden="true">↗</span><span>Movement</span></button>
      <button class="nav-item" type="button" role="tab" data-page="insights" aria-selected="false"><span aria-hidden="true">▥</span><span>Insights</span></button>
      <button class="nav-item" type="button" role="tab" data-page="health" aria-selected="false"><span aria-hidden="true">♡</span><span>Health</span></button>
      <button class="nav-item" type="button" role="tab" data-page="settings" aria-selected="false"><span aria-hidden="true">⚙</span><span>Settings</span></button>
    </nav>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script>
    // Inline navigation fallback: must work even when ES modules fail to load.
    (() => {
      const validPages = new Set(["overview", "movement", "insights", "health", "settings"]);
      document.addEventListener("click", event => {
        const button = event.target && event.target.closest
          ? event.target.closest("button[data-page]") : null;
        if (!button || !validPages.has(button.dataset.page)) return;
        const page = button.dataset.page;
        document.querySelectorAll("[data-page-panel]").forEach(panel => {
          const active = panel.dataset.pagePanel === page;
          panel.hidden = !active;
          panel.setAttribute("aria-hidden", String(!active));
        });
        document.querySelectorAll("button[data-page]").forEach(tab => {
          const active = tab.dataset.page === page;
          tab.setAttribute("aria-selected", String(active));
          tab.tabIndex = active ? 0 : -1;
        });
      }, true);
    })();
  </script>
  <script>
    // Classic-script loader catches module download, MIME, and parse failures visibly.
    (() => {
      const showLoadError = error => {
        const host = document.querySelector("[data-medication-content]");
        if (!host) return;
        const card = document.createElement("section");
        card.className = "health-card";
        const title = document.createElement("h3");
        title.textContent = "অ্যাপের JavaScript চালু হয়নি";
        const message = document.createElement("p");
        message.textContent = error && error.message ? error.message : String(error);
        const help = document.createElement("p");
        help.textContent = "Technical diagnostic নিচে দেওয়া হলো। এই লেখাটি কপি করে পাঠান।";
        const details = document.createElement("details");
        details.open = true;
        const summary = document.createElement("summary");
        summary.textContent = "Technical diagnostic";
        const trace = document.createElement("pre");
        trace.style.whiteSpace = "pre-wrap";
        trace.style.overflowWrap = "anywhere";
        trace.textContent = error && error.stack ? String(error.stack) : String(error);
        details.append(summary, trace);
        card.append(title, message, help, details);
        host.replaceChildren(card);
      };
      import("./assets/js/bootstrap.js").catch(showLoadError);
    })();
  </script>
</body>
</html>
